name: Release npm package

# Publishes the standalone `amide` CLI package (packages/coding-agent) to
# npm. This is deliberately separate from build-binaries.yml, which handles
# the R2/S3 binary distribution channel - this workflow only needs to make
# `npm i -g amide` work.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish (e.g., v0.9.1). Must match packages/coding-agent/package.json version.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        working-directory: packages/coding-agent
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED="${RELEASE_TAG#v}"
          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/coding-agent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
